services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet}
      POSTGRES_DB: fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20

  fleetd:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment: # container-internal settings; these take precedence over .env
      DATABASE_URL: postgres://fleet:${POSTGRES_PASSWORD:-fleet}@postgres:5432/fleet?sslmode=disable
      HTTP_ADDR: ":8080"
      TELTONIKA_ADDR: ":5027"
      WEB_DIR: /app/web
    ports:
      - "8080:8080"
      - "5027:5027/tcp"
      - "5027:5027/udp"

volumes:
  pgdata:
